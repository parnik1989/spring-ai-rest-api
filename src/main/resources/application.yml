server:
  port: 8080

spring:
  application:
    name: spring-ai-eventsphere-api

  datasource:
    url: jdbc:postgresql://localhost:5432/eventsphere_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
  ai:
    openai:
      api-key: "${OPENAI_API_KEY:}"
      model: "gpt-4.1-mini"
