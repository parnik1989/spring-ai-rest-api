server:
  port: 8080
spring:
  application:
    name: spring-ai-eventsphere-api
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

  # datasource:
  #   url: jdbc:postgresql://localhost:5432/eventsphere_db
  #   username: postgres
  #   password: postgres
  #   show-sql: true
  #   properties:
  #     hibernate:
  #       format_sql: true
  ai:
    openai:
      api-key: "${OPENAI_API_KEY:}"
      model: "gpt-4.1-mini"
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"